# Blueprint do Render para o backend do EchoRoom.
# Render → New → Blueprint → selecione este repositório.
services:
  - type: web
    name: echoroom-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Domínio do front na Vercel (sem barra no final). Ajuste após o deploy.
      - key: ECHOROOM_CORS
        value: https://echoroom.vercel.app
      # Libera também os previews da Vercel do projeto.
      - key: ECHOROOM_CORS_REGEX
        value: https://echoroom.*\.vercel\.app
