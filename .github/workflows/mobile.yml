# Gera o app Android (APK) e publica para download na página de Releases do GitHub.
# Usa as mesmas variáveis do site: FIREBASE_CONFIG, DISCORD_CLIENT_ID e AUTH_URL.
name: Gerar app Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/web/src/**'
      - 'packages/shared/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash
    env:
      EXPO_PUBLIC_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
      EXPO_PUBLIC_DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
      EXPO_PUBLIC_AUTH_URL: ${{ vars.AUTH_URL }}
      EXPO_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      EXPO_NO_TELEMETRY: 1
      CI: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Em caso de erro, as últimas linhas do log aparecem como aviso no resumo da execução.
      - name: Preparar
        working-directory: .
        run: |
          cat > /tmp/run.sh <<'EOF'
          # uso: run.sh "Título" comando...
          title="$1"; shift
          log=$(mktemp)
          set -o pipefail
          if "$@" 2>&1 | tee "$log"; then exit 0; fi
          msg=$(grep -v '^\s*$' "$log" | tail -n 45 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=$title::$msg"
          exit 1
          EOF
          chmod +x /tmp/run.sh

      - name: Instalar dependências
        run: |
          /tmp/run.sh "npm install" npm install --no-audit --no-fund
          /tmp/run.sh "expo install --fix" npx expo install --fix
          # Módulos nativos do Expo precisam ser todos da mesma versão do SDK.
          npm ls expo-modules-core expo-font expo-asset expo-constants 2>/dev/null || true
          /tmp/run.sh "expo-doctor" npx expo-doctor || echo "::warning title=expo-doctor::veja o log"

      - name: Checar tipos (aviso)
        continue-on-error: true
        run: /tmp/run.sh "TypeScript" npx tsc --noEmit

      - name: Empacotar o JavaScript (checagem rápida)
        run: /tmp/run.sh "Metro" npx expo export --platform android --output-dir /tmp/js-check

      - name: Gerar projeto Android
        run: /tmp/run.sh "prebuild" npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: apps/mobile/android
        run: /tmp/run.sh "Gradle" ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/EchoRoom.apk
          tag=android-latest
          notes="App Android do EchoRoom gerado automaticamente a partir de ${GITHUB_SHA::7}. Baixe o EchoRoom.apk no celular e instale (permita instalar de fontes desconhecidas)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" /tmp/EchoRoom.apk --clobber
            gh release edit "$tag" --notes "$notes" --title "EchoRoom para Android"
          else
            gh release create "$tag" /tmp/EchoRoom.apk --title "EchoRoom para Android" --notes "$notes" --target "$GITHUB_SHA"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: EchoRoom-android
          path: /tmp/EchoRoom.apk
          retention-days: 14
