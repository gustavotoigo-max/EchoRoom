# Publica o front-end no GitHub Pages a cada push na branch main.
# Requer: Settings → Pages → Source = "GitHub Actions"
#         Settings → Secrets and variables → Actions → Variables → FIREBASE_CONFIG
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testes da sincronização
        run: npm test

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
        run: |
          if [ -z "$VITE_FIREBASE_CONFIG" ]; then
            echo "::warning::Variável FIREBASE_CONFIG não definida. O site vai mostrar a tela de configuração."
          fi
          npm run build
          # Links diretos como /EchoRoom/room/ABX72 caem no 404 do Pages: servimos o app nele também.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
