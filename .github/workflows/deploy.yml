# GitHub Pages do EchoRoom (gustavotoigo-max.github.io/EchoRoom): só redireciona para o
# site novo, https://www.spectracast.com.br/sala/ (publicado pelo repo Spectra).
name: Redirecionar GitHub Pages para o SpectraCast

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O site do EchoRoom mudou para https://www.spectracast.com.br/sala/ (repo Spectra).
      # Aqui só fica um redirecionamento: qualquer link antigo (inclusive /room/CODIGO)
      # leva para o mesmo caminho no endereço novo.
      - name: Página de redirecionamento
        run: |
          mkdir -p out
          cp redirect/index.html out/index.html
          cp redirect/index.html out/404.html
          touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
